[package]
name = "atlas-mac-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Per-Mac agent: serves a Mac's disk inventory to a central Atlas gateway"

[[bin]]
name = "atlas-mac-agent"
path = "src/bin/atlas-mac-agent.rs"

[dependencies]
atlas-api-types = { workspace = true }
atlas-driver-core = { workspace = true }
atlas-driver-macos = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
