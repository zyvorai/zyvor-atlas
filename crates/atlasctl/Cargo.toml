[package]
name = "atlasctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
clap = { workspace = true }
# atlasctl is the only crate cross-compiled for release (release.yml's binaries matrix, incl.
# aarch64-unknown-linux-gnu) — the workspace default (aws-lc-rs) needs a C/cmake toolchain for the
# target arch that the cross toolchain doesn't have. `rustls-no-provider` + the `ring` provider
# installed in main() has no such dependency, so it cross-compiles cleanly; scoped to just this
# crate (declared directly rather than inheriting `workspace = true`, since a member can't turn
# default-features off through that path), not the workspace default. reqwest 0.13's rustls
# backend verifies through the OS trust store (rustls-platform-verifier), the same trust model as
# the former `rustls-tls-native-roots` feature, and keeps webpki-roots out of the graph.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# `tests/checkpoint_seal.rs` runs the built `atlasctl` binary against an in-process gateway on the
# fake atlas-native driver. Dev-only: the release cross-build of atlasctl never compiles these.
atlas-gateway = { path = "../atlas-gateway" }
atlas-common = { workspace = true }
atlas-driver-native = { workspace = true }
axum = { workspace = true }
tempfile = { workspace = true }
