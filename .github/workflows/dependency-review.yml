name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Mirrors deny.toml's [licenses] allow-list, so a PR gets the same signal
          # cargo-deny already gives main for the Rust side. MIT-0 and 0BSD are permissive
          # (MIT / BSD without the notice requirement) and appear in the website lockfile.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
            Unicode-3.0, Zlib, Unlicense, BSL-1.0, Apache-2.0, CDLA-Permissive-2.0, MIT-0, 0BSD
          # caniuse-lite is browser-support data (CC-BY-4.0), build-time only via browserslist in
          # the website and UI toolchains; exempted by name so CC-BY-4.0 stays rejected elsewhere.
          allow-dependencies-licenses: pkg:npm/caniuse-lite
          comment-summary-in-pr: always
