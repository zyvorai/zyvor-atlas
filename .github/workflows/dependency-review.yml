name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Mirrors deny.toml's [licenses] allow-list, so a PR gets the same signal
          # cargo-deny already gives main for the Rust side.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
            Unicode-3.0, Zlib, Unlicense, BSL-1.0, Apache-2.0, CDLA-Permissive-2.0
          comment-summary-in-pr: always
