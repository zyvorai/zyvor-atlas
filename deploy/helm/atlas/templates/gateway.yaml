{{- if .Values.gateway.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "gateway.enabled and ingress.enabled are mutually exclusive" }}
{{- end }}
{{- if not .Values.gateway.host }}
{{- fail "gateway.host is required when gateway.enabled" }}
{{- end }}
{{- if .Values.gateway.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "atlas.fullname" . }}
  namespace: {{ include "atlas.namespace" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.tlsSecretName }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsPort }}
      hostname: {{ .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
{{- end }}
