{{- if .Values.envoy.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "envoy.enabled and ingress.enabled are mutually exclusive" }}
{{- end }}
{{- if not .Values.envoy.host }}
{{- fail "envoy.host is required when envoy.enabled" }}
{{- end }}
{{- if .Values.envoy.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "atlas.fullname" . }}
  namespace: {{ include "atlas.namespace" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.envoy.gatewayClassName | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.envoy.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.envoy.tlsSecretName }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.envoy.httpsPort }}
      hostname: {{ .Values.envoy.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.envoy.tlsSecretName | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
{{- end }}
